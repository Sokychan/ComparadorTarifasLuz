name: Actualización Automática de Tarifas de Luz

on:
  schedule:
    # Se ejecuta cada 3 días a las 04:25 UTC (05:25 AM hora española)
    - cron: '25 4 */1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Xvfb, Playwright y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Ejecutar Extractor de Tarifas de Luz (con pantalla virtual Xvfb)
        run: xvfb-run python ExtractorTarifas.py

      - name: Hacer Commit y Push del JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tarifas_mercado.json
          git diff-index --quiet HEAD || git commit -m "bot: actualización automática de tarifas de luz"
          git push
