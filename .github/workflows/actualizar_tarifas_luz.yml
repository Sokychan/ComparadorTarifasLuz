name: Actualización Automática de Tarifas de Luz

on:
  schedule:
    # Se ejecuta todos los lunes a las 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Botón para ejecución manual en GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Ejecutar Extractor de Tarifas de Luz
        run: python ExtractorTarifas.py

      - name: Hacer Commit y Push del JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tarifas_mercado.json
          git diff-index --quiet HEAD || git commit -m "bot: actualización automática de tarifas de luz"
          git push
